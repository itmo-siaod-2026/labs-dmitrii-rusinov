plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.2'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ── JCStress source set ──────────────────────────────────────────────────────
sourceSets {
    jcstress {
        java.srcDir 'src/jcstress/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JMH
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    // JCStress (compile + annotation processor + runtime)
    jcstressImplementation 'org.openjdk.jcstress:jcstress-core:0.16'
    jcstressAnnotationProcessor 'org.openjdk.jcstress:jcstress-core:0.16'
}

test {
    useJUnitPlatform()
    maxHeapSize = '512m'
}

// ── JMH ─────────────────────────────────────────────────────────────────────
jmh {
    resultFormat = 'JSON'
    resultsFile = project.file("${buildDir}/reports/jmh/results.json")
    fork = 1
    warmupIterations = 3
    warmup = '1s'
    iterations = 8
    timeOnIteration = '1s'
    failOnError = true
    includeTests = false
}

// ── JCStress task ────────────────────────────────────────────────────────────
tasks.register('jcstress', JavaExec) {
    dependsOn jcstressClasses
    group = 'verification'
    description = 'Run JCStress concurrency stress tests'
    classpath = sourceSets.jcstress.runtimeClasspath
    mainClass = 'org.openjdk.jcstress.Main'
    def reportDir = layout.buildDirectory.dir('reports/jcstress').get().asFile
    args '-r', reportDir.absolutePath, '-m', 'quick', '-time', '200'
    doFirst { reportDir.mkdirs() }
}
